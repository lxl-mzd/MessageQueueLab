name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: restore
        run: dotnet restore

      - name: build
        run: dotnet build --no-restore

      - name: unit tests
        run: dotnet test tests/MessageQueueLab.Tests/MessageQueueLab.Tests.csproj --no-build --verbosity normal

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: fresh compose cluster (3 nodes)
        run: docker compose up -d --build

      - name: wait for containers
        run: sleep 15

      - name: run smoke (raft + quorum + DLX + failover)
        run: pwsh tests/smoke.ps1

      - name: teardown
        if: always()
        run: docker compose down --volumes
