x-mq-peers: &mq-peers "http://mq-leader:8080,http://mq-follower-1:8080,http://mq-follower-2:8080"

services:
  mq-leader:
    image: mq-lab:17
    build: .
    environment:
      MQ_ROLE: leader
      MQ_NODE_NAME: node-leader
      MQ_SELF: "http://mq-leader:8080"
      MQ_PEERS: *mq-peers
      MQ_FOLLOWERS: "http://mq-follower-1:8080,http://mq-follower-2:8080"
      MQ_LEADER_URL: "http://mq-leader:8080"
    ports:
      - "5081:8080"
    volumes:
      - mqlab-leader:/app/data

  mq-follower-1:
    image: mq-lab:17
    environment:
      MQ_ROLE: follower
      MQ_NODE_NAME: node-follower-1
      MQ_SELF: "http://mq-follower-1:8080"
      MQ_PEERS: *mq-peers
      MQ_LEADER_URL: "http://mq-leader:8080"
    ports:
      - "5082:8080"
    volumes:
      - mqlab-follower-1:/app/data

  mq-follower-2:
    image: mq-lab:17
    environment:
      MQ_ROLE: follower
      MQ_NODE_NAME: node-follower-2
      MQ_SELF: "http://mq-follower-2:8080"
      MQ_PEERS: *mq-peers
      MQ_LEADER_URL: "http://mq-leader:8080"
    ports:
      - "5083:8080"
    volumes:
      - mqlab-follower-2:/app/data

volumes:
  mqlab-leader:
  mqlab-follower-1:
  mqlab-follower-2:
