name: Release

name: Release

on:
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  packages: write
  contents: read

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lxl-mzd/messagequeue-lab:latest
            ghcr.io/lxl-mzd/messagequeue-lab:${{ github.sha }}

  smoke-image:
    runs-on: ubuntu-latest
    needs: publish-image
    steps:
      - name: pull public image & boot one node
        run: |
          docker run -d --rm --name mq-smoke -p 5099:8080 ghcr.io/lxl-mzd/messagequeue-lab:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5099/health > /dev/null; then echo "SMOKE OK (health)"; break; fi
            sleep 3
          done
          docker rm -f mq-smoke
