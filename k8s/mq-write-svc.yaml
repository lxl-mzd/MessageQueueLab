# ═══════════════════════════════════════════════════════════════
# k8s/mq-write-svc.yaml —— 业务写入口 Service
#   readinessProbe 用 /api/raft/write-ready（非 Leader 503）
#   → 一个 Service 自动只指向当前 Leader 那一台 Pod
#     （Pod 的 readiness 状态由 StatefulSet 的探针定义统一控制）
#     即："业务方永远打 mq-write，而 mq-write 自动跟 Raft 王走"
#   NodePort 31081 暴露给宿主机，本地演示方便
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: mq-write
spec:
  type: NodePort
  selector:
    app: mqlab
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31081
